<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Railroad Studio</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav id="sidebar" class="studio-sidebar"></nav>
    <div class="app-main">
      <header id="header" class="app-header">
        <h2 class="app-title">Open a save</h2>
      </header>
      <main id="content" class="app-content">
        <div id="drop-area">
          <form class="drop-form">
            <div class="drop-icon mb-3"><i class="bi bi-folder2-open" aria-hidden="true"></i></div>
            <h3 class="mb-2">Drop a Railroads Online save here</h3>
            <p class="text-body-secondary">
              Or browse for a <code>.sav</code> file. Everything stays on your computer.
            </p>
            <input class="form-control form-control-lg" type="file" id="fileElem" accept=".sav" />
            <div class="form-text mt-3">
              Save files are located in
              <span class="save-path">
                <code id="savePath">%localappdata%\arr\saved\savegames</code>
                <button type="button" class="btn btn-sm btn-quiet" id="copySavePath">Copy path</button>
              </span>
            </div>
            <div class="form-text">Paste that path into the file picker's file name box to jump straight there.</div>
          </form>
        </div>
      </main>
    </div>
    <script src="studio.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
